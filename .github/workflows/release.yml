name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'publish' to upload to PyPI"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the metadata twine will accept
        run: twine check dist/*

      - name: Verify the wheel is sound before it can be published
        run: python scripts/check_wheel.py dist

      - name: Install the wheel and run a real scan from it
        # The end-to-end check: install the artifact the way a user would, then
        # use it. Exit 1 is the expected result here, because the fixture
        # contains critical findings and --fail-on critical is the contract.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/mcp-scrutiny --version

          set +e
          /tmp/verify/bin/mcp-scrutiny scan \
            --tools-json tests/fixtures/tools-poisoned.json \
            --fail-on critical --no-color
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 (critical findings found), got $code"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: attach the artifacts to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create or update the release with the installable artifacts
        # This is what makes the package installable before PyPI is configured:
        #
        #   pip install https://github.com/bryand410/mcp-scrutiny/releases/download/v0.1.0/mcp_scrutiny-0.1.0-py3-none-any.whl
        #
        # The tag alone is therefore enough to ship something a stranger can
        # install. PyPI adds discovery, not availability.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

  publish:
    name: publish to PyPI
    needs: build
    # Deliberately manual, and deliberately not on tag push.
    #
    # A tag builds and attaches the wheel to the GitHub release, so the package
    # is installable immediately and an accidental tag can never push to the
    # index. Uploading to PyPI requires typing "publish" in the Actions UI.
    # The `confirm` input existed from the first version of this file and was
    # never wired up; it is now the gate it claims to be.
    #
    # To publish: Actions -> Release -> Run workflow -> select the tag v0.1.0
    # -> type "publish".
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    # Trusted publishing: no API token is stored anywhere. PyPI verifies the
    # workflow's OIDC identity instead, which is the only kind of credential
    # that cannot leak from a repository secret.
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-scrutiny
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Fail rather than silently skip if the version already exists.
          skip-existing: false
